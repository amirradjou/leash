<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How leash works</title>
  <desc id="d">The LLM agent signs a user operation with its session key. EntryPoint v0.8 hands it to LeashAccount, the EIP-7702 code on the owner's address, which checks the allowlist, the per-period cap, the per-counterparty limit and an optional passkey co-signature before anything reaches the chain. A refused call returns its reason to the agent. The owner grants the session and holds the passkey.</desc>
  <style>
    .box { fill: #f3f6fa; stroke: #8fa6c2; stroke-width: 1.2; }
    .key { fill: #e3ecf7; stroke: #2f5f98; stroke-width: 1.6; }
    .row { fill: #ffffff; stroke: #c5d3e4; stroke-width: 1; }
    .h { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12px; }
    .r { fill: #1f2328; font-size: 12.5px; }
    .n { fill: #2f5f98; font-size: 12.5px; font-weight: 600; }
    .line { stroke: #2f5f98; stroke-width: 1.6; fill: none; }
    .back { stroke: #8fa6c2; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #2f5f98; }
    .headb { fill: #8fa6c2; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #4a6585; }
      .key { fill: #13233a; stroke: #79a6dc; }
      .row { fill: #0d1117; stroke: #30435c; }
      .h, .r { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .n { fill: #79a6dc; }
      .line { stroke: #79a6dc; }
      .back { stroke: #4a6585; }
      .head { fill: #79a6dc; }
      .headb { fill: #4a6585; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- owner -->
  <rect class="box" x="170" y="14" width="270" height="52" rx="8"/>
  <text class="h" x="186" y="37">Owner</text>
  <text class="s" x="186" y="55">grants the session, holds the passkey</text>
  <path class="line" d="M440 40 H520 V78" marker-end="url(#a)"/>

  <!-- agent -->
  <rect class="box" x="16" y="130" width="124" height="70" rx="8"/>
  <text class="h" x="30" y="158">LLM agent</text>
  <text class="s" x="30" y="178">sees attacker text</text>
  <text class="s" x="30" y="193">in tool output</text>
  <path class="line" d="M140 165 H166" marker-end="url(#a)"/>

  <!-- session key -->
  <rect class="box" x="170" y="130" width="124" height="70" rx="8"/>
  <text class="h" x="184" y="158">Session key</text>
  <text class="s" x="184" y="178">signs a</text>
  <text class="s" x="184" y="193">UserOperation</text>
  <path class="line" d="M294 165 H316" marker-end="url(#a)"/>

  <!-- entrypoint -->
  <rect class="box" x="320" y="130" width="124" height="70" rx="8"/>
  <text class="h" x="334" y="158">EntryPoint v0.8</text>
  <text class="s" x="334" y="178">ERC-4337</text>
  <text class="s" x="334" y="193">validate, execute</text>
  <path class="line" d="M444 165 H466" marker-end="url(#a)"/>

  <!-- leash account -->
  <rect class="key" x="470" y="82" width="258" height="196" rx="10"/>
  <text class="h" x="486" y="106">LeashAccount</text>
  <text class="s" x="486" y="123">EIP-7702 code on the owner's address</text>
  <rect class="row" x="484" y="134" width="230" height="30" rx="5"/>
  <text class="n" x="494" y="154">1</text><text class="r" x="510" y="154">allowlist of (target, selector)</text>
  <rect class="row" x="484" y="169" width="230" height="30" rx="5"/>
  <text class="n" x="494" y="189">2</text><text class="r" x="510" y="189">spend cap per asset per period</text>
  <rect class="row" x="484" y="204" width="230" height="30" rx="5"/>
  <text class="n" x="494" y="224">3</text><text class="r" x="510" y="224">limit per counterparty</text>
  <rect class="row" x="484" y="239" width="230" height="30" rx="5"/>
  <text class="n" x="494" y="259">4</text><text class="r" x="510" y="259">passkey co-sign lifts 2 and 3</text>
  <path class="line" d="M728 165 H756" marker-end="url(#a)"/>

  <!-- chain -->
  <rect class="box" x="760" y="130" width="124" height="70" rx="8"/>
  <text class="h" x="774" y="158">Chain</text>
  <text class="s" x="774" y="178">tokens, ETH,</text>
  <text class="s" x="774" y="193">swap router</text>

  <!-- refusal path -->
  <path class="back" d="M599 278 V306 H78 V204" marker-end="url(#b)"/>
  <text class="s" x="92" y="298">refused: the reason goes back to the agent, which can ask the owner to approve</text>
</svg>
