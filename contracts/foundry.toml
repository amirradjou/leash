[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "account-abstraction/=lib/account-abstraction/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# A heavier campaign: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1024
depth = 128

# Lints that flag what a batching wallet does on purpose: external calls (and reverts) inside the batch loop, ETH
# sent where the call says, events after calls, block.timestamp for spend periods.
[lint]
exclude_lints = [
    "arbitrary-send-eth",
    "block-timestamp",
    "calls-loop",
    "missing-zero-check",
    "reentrancy-events",
    "require-revert-in-loop",
    "uninitialized-local",
    "unsafe-typecast",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
